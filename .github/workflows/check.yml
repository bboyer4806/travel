name: Check

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Verify production error responses and validation
        run: node scripts/review-errors-smoke.mjs
      - name: Install Chromium for the editor focus check
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: Verify editor focus in desktop and phone browsers
        run: node scripts/editor-focus-smoke.mjs
      - name: Verify container and persistent storage
        run: bash scripts/smoke-container.sh
