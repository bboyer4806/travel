name: Deploy

# Builds on GitHub's runners, pushes the image to GHCR, then has Dokku on the
# server run it. The Dokku app, its domain and its HTTPS certificate are set up
# here too. Persistent storage must be provisioned first; see docs/DEPLOYMENT.md. Copy this
# file, change APP and DOMAIN, add the secrets docs/DEPLOYMENT.md lists, push.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time. A running deploy is never cancelled; a newer push
# replaces one still waiting to start, so the latest commit is what goes live.
# Runs from other branches never deploy, and their own group keeps them from
# replacing a deploy from main that is waiting to start.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  APP: travel
  DOMAIN: travel.dev.boyersoftware.com

jobs:
  checks:
    uses: ./.github/workflows/check.yml

  deploy:
    # Production deploys only from main. A manual run from any other branch
    # still runs the checks, but never builds, publishes or deploys an image.
    if: github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Tagged by commit so a rollback is naming an older tag, not a rebuild.
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A failed off-host backup blocks deployment before production data is touched.
      - name: Require verified off-host backup
        env:
          BACKUP_KEY: ${{ secrets.TRAVEL_BACKUP_HOST_SSH_KEY }}
          BACKUP_HOST: ${{ secrets.DOKKU_HOST }}
          BACKUP_KNOWN_HOSTS: ${{ secrets.TRAVEL_BACKUP_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${BACKUP_KEY:?Configure TRAVEL_BACKUP_HOST_SSH_KEY}"
          : "${BACKUP_HOST:?Configure DOKKU_HOST}"
          : "${BACKUP_KNOWN_HOSTS:?Configure TRAVEL_BACKUP_KNOWN_HOSTS}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$BACKUP_KEY" > ~/.ssh/travel_backup
          printf '%s\n' "$BACKUP_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/travel_backup ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/travel_backup "backup-runner@$BACKUP_HOST" sudo /usr/local/sbin/travel-offhost-backup

      - name: Deploy to Dokku
        env:
          SSH_KEY: ${{ secrets.DOKKU_SSH_KEY }}
          HOST: ${{ secrets.DOKKU_HOST }}
          # The verified, pinned host key of DOKKU_HOST, the same one the backup
          # step trusts; see docs/DEPLOYMENT.md.
          KNOWN_HOSTS: ${{ secrets.TRAVEL_BACKUP_KNOWN_HOSTS }}
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
        run: |
          set -euo pipefail
          : "${SSH_KEY:?Add the DOKKU_SSH_KEY secret under Settings > Secrets and variables > Actions}"
          : "${HOST:?Add the DOKKU_HOST secret under Settings > Secrets and variables > Actions}"
          : "${KNOWN_HOSTS:?Add the verified host key as the TRAVEL_BACKUP_KNOWN_HOSTS secret; see docs/DEPLOYMENT.md}"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

          # Dokku runs exactly one command per SSH call. Only the pinned host
          # key is trusted: a server presenting any other key stops the deploy.
          dokku() { ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/id_ed25519 "dokku@$HOST" "$@"; }

          dokku apps:exists "$APP" || dokku apps:create "$APP"
          # Before the first deploy, so Dokku proxies to the port the image
          # exposes rather than its default of 5000.
          dokku domains:set "$APP" "$DOMAIN"
          # A photo save can send 16 MiB, far over Dokku's 1m default. Set
          # before deploying: every deploy rebuilds the nginx config, so new
          # and existing apps both get it.
          dokku nginx:set "$APP" client-max-body-size 20m

          # Re-running a workflow deploys the same image again, which Dokku
          # reports as "No changes detected" with a non-zero exit. Nothing
          # failed, and the certificate step below still needs to run.
          dokku git:from-image "$APP" "$IMAGE" 2>&1 | tee deploy.log \
            || grep -q "No changes detected" deploy.log

          # Needs the DNS record in place. Checked first so a deploy never
          # requests a certificate the app already has.
          if [ "$(dokku letsencrypt:active "$APP")" != "true" ]; then
            dokku letsencrypt:enable "$APP"
          fi
